[package]
name = "strx"
version = "0.1.0"
edition = "2021"
authors = ["strx contributors"]
description = "A high-performance, heuristic drop-in replacement for the Unix 'strings' tool"
license = "MIT"
readme = "README.md"
keywords = ["strings", "forensics", "extraction", "heuristics", "cli"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
# CLI Parsing
clap = { version = "4.4", features = ["derive"] }

# Memory Management
memmap2 = "0.9"

# Error Handling
anyhow = "1.0"

# Pattern Matching
regex = "1.10"
aho-corasick = "1.1"

# Fuzzy Matching
strsim = "0.10"

# Encoding
base64 = "0.21"
encoding_rs = "0.8" # Für UTF-16 Detection

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Terminal Output
colored = "2.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

[[bin]]
name = "strx"
path = "src/main.rs"
